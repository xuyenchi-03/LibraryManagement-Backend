<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="signup.css">
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <script src="https://kit.fontawesome.com/f75dde5b4d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="row">
        <div class="signin-column">
            <div class="signin-container">
                <i class="fa-solid fa-book" style="position: absolute; top: 130px; font-size: 200px; color: white;"></i>
                <h1>E-Library</h1>
                <p>Already have an account? Sign in now</p>
                <a class="sign-in" href="signin.html">Sign in</a>
            </div>
        </div>
        <div class="signup-column">
            <div class="signup-container">
                <h1>Sign Up</h1>
                <h2>Please provide your information to sign up</h2>
                <form>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="submit" value="Sign up">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
