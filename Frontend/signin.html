<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="signin.css">
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <script src="https://kit.fontawesome.com/f75dde5b4d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="row">
        <div class="signin-column">
            <div class="signin-container">
                <h1>Welcome back!</h1>
                <h2>Please enter your credentials to sign in</h2>
                <form>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <p>
                        <a class="forgot-password" href="forgotpassword.html">Forget password?</a>
                    </p>
                    <input type="submit" value="Sign in">
                </form>
            </div>
        </div> 
        <div class="signup-column">
            <div class="signup-container">
                <i class="fa-solid fa-book" style="position: absolute; top: 130px; font-size: 200px; color: white;"></i>
                <h1>E-Library</h1>
                <p>New to our platform? Sign Up now</p>
                <a class="sign-up" href="signup.html">Sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
