<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgotpassword.css">
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <script src="https://kit.fontawesome.com/f75dde5b4d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="row">
        <div class="forgot-password-column">
            <div class="forgot-password-container">
                <h1>Forgot Password</h1>
                <h2>Please enter your email</h2>
                <form>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="submit" value="Reset Password">
                </form>
            </div>
            <a class="back-button" href="signin.html">Back</a>
        </div> 
        <div class="signup-column">
            <div class="signup-container">
                <i class="fa-solid fa-book" style="position: absolute; top: 130px; font-size: 200px; color: white;"></i>
                <h1>E-Library</h1>
                <p>New to our platform? Sign Up now</p>
                <a class="sign-up" href="signup.html">Sign up</a>
            </div>        
        </div>
    </div>
</body>
</html>
